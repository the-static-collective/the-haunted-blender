name: franken-blender-008e

on:
  push:
    branches:
      - integration/franken-blender-008e-zero-dollar-film-mill
  pull_request:
    branches:
      - integration/franken-blender-008d-plugin-orchard

jobs:
  zero-dollar-film:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Pillow
        run: python -m pip install --upgrade pip "Pillow>=9"
      - name: Compile Python
        run: python -m compileall -q haunted_blender
      - name: Check browser JavaScript
        run: node --check haunted_blender/web/cockpit.js
      - name: Full suite
        run: python -m unittest discover -s tests -v
      - name: Zero-dollar command door
        run: python -m haunted_blender.zero_dollar_cli --help
      - name: Orchard command door
        run: python -m haunted_blender.plugin_orchard_cli --help
      - name: Visual Cockpit command door
        run: python -m haunted_blender.cockpit_web --help
