name: Nuklear Pantry Exchange proof

on:
  pull_request:
    paths:
      - 'haunted_blender/pantry_exchange.py'
      - 'haunted_blender/exchange_cli.py'
      - 'tests/test_pantry_exchange.py'
      - '.github/workflows/pantry-exchange.yml'
  push:
    branches:
      - experimental/nuklear-pantry-exchange-001

permissions:
  contents: read

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Compile all Blender modules
        run: python -m compileall -q haunted_blender
      - name: Run scaffold, alchemy, and actual MP4 exchange tests
        run: python -m unittest discover -s tests -v
      - name: Verify export CLI door
        run: python -m haunted_blender.exchange_cli --help
