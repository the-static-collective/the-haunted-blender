name: N5 multipart object alpha/clock proof

on:
  pull_request:
    paths:
      - 'haunted_blender/living_object.py'
      - 'haunted_blender/living_object_cli.py'
      - 'tests/test_living_object.py'
      - '.github/workflows/living_object.yml'
  push:
    branches:
      - experimental/living-object-v0.1

jobs:
  object:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local optional rendering dependencies
        run: |
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Compile N0 through N5
        run: python -m compileall -q haunted_blender
      - name: Run all contract tests and actual decoded frames
        run: python -m unittest discover -s tests -v
      - name: Smoke all existing and new command doors
        run: |
          python -m haunted_blender --help
          python -m haunted_blender.alchemy_cli --help
          python -m haunted_blender.correspondence_cli --help
          python -m haunted_blender.living_mesh_cli --help
          python -m haunted_blender.contour_cli --help
          python -m haunted_blender.living_object_cli --help
