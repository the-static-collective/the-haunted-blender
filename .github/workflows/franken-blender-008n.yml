name: franken-blender-008n

on:
  push:
    branches:
      - integration/franken-blender-008n-particular-to-performance
  pull_request:
    branches:
      - integration/franken-blender-008m-manga-anime-grammar-atlas

jobs:
  particular-to-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Pillow
        run: python -m pip install --upgrade pip "Pillow>=9"
      - name: Compile Python
        run: python -m compileall -q haunted_blender
      - name: Check browser JavaScript
        run: node --check haunted_blender/web/cockpit.js
      - name: Full suite
        run: python -m unittest discover -s tests -v
      - name: 008n command door
        run: |
          rm -rf /tmp/particular-performance-008n
          python -m haunted_blender.narrative_performance_cli smash \
            specimens/008n/bus-page-5-a-page-you-can-hear-001.json \
            /tmp/particular-performance-008n
          test -f /tmp/particular-performance-008n/particular-performance.return.json
