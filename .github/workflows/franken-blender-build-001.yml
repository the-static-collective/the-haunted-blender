name: franken-blender-build-001

on:
  push:
    branches:
      - integration/franken-blender-001
  pull_request:
    branches:
      - main

jobs:
  full-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip "Pillow>=9"
      - name: Compile
        run: python -m compileall -q haunted_blender
      - name: Full discovered suite
        run: python -m unittest discover -s tests -v
      - name: Base command door
        run: python -m haunted_blender --help
