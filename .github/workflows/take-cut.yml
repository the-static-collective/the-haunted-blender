name: Accepted take cut proof
on:
  push:
    branches:
      - experimental/accepted-take-cut-001
  pull_request:
    paths:
      - 'haunted_blender/take_cut*.py'
      - 'tests/test_take_cut.py'
      - 'docs/TAKE_CUT_001.md'
      - '.github/workflows/take-cut.yml'
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m compileall -q haunted_blender
      - run: python -m unittest discover -s tests -v
      - run: python -m haunted_blender.take_cut_cli --help
