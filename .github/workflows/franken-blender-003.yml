name: franken-blender-003

on:
  push:
    branches:
      - integration/franken-blender-003-dreambreeder
  pull_request:
    branches:
      - integration/franken-blender-002-cutout-machine

jobs:
  dreambreeder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Pillow
        run: python -m pip install --upgrade pip "Pillow>=9"
      - name: Compile
        run: python -m compileall -q haunted_blender
      - name: Full suite
        run: python -m unittest discover -s tests -v
      - name: Dreambreeder command door
        run: python -m haunted_blender.dreambreeder_cli --help
