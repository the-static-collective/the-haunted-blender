name: franken-blender-007
on:
  push:
    branches:
      - integration/franken-blender-007-atlas-executor
  pull_request:
    branches:
      - integration/franken-blender-006-motion-organ-router
jobs:
  atlas-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Pillow
        run: python -m pip install --upgrade pip "Pillow>=9"
      - name: Compile
        run: python -m compileall -q haunted_blender
      - name: Full suite
        run: python -m unittest discover -s tests -v
      - name: Executor command door
        run: python -m haunted_blender.motion_executor_cli --help
