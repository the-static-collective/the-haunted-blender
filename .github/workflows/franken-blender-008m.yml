name: franken-blender-008m

on:
  push:
    branches:
      - integration/franken-blender-008m-manga-anime-grammar-atlas
  pull_request:
    branches:
      - integration/franken-blender-008l-material-surface-grammar

jobs:
  manga-anime-grammar-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Pillow
        run: python -m pip install --upgrade pip "Pillow>=9"
      - name: Compile Python
        run: python -m compileall -q haunted_blender
      - name: Check browser JavaScript
        run: node --check haunted_blender/web/cockpit.js
      - name: Full suite
        run: python -m unittest discover -s tests -v
      - name: Manga Atlas command door
        run: python -m haunted_blender.manga_atlas_cli --help
      - name: Material command door
        run: python -m haunted_blender.material_cli --help
      - name: Ensemble command door
        run: python -m haunted_blender.ensemble_cli --help
      - name: Paper Director command door
        run: python -m haunted_blender.paper_director_cli --help
