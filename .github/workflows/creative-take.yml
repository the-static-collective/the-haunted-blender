name: Creative Claw take contracts
on:
  push:
    branches:
      - experimental/creative-claw-take-001
  pull_request:
    paths:
      - 'haunted_blender/creative_take*.py'
      - 'tests/test_creative_take.py'
      - 'docs/CREATIVE_CLAW_TAKE_001.md'
      - '.github/workflows/creative-take.yml'
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m compileall -q haunted_blender
      - run: python -m unittest discover -s tests -v
      - run: python -m haunted_blender.creative_take_cli --help
