name: franken-blender-008h

on:
  push:
    branches:
      - integration/franken-blender-008h-parts-harvester
  pull_request:
    branches:
      - integration/franken-blender-008g-cutout-puppet-factory

jobs:
  parts-harvester:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Pillow
        run: python -m pip install --upgrade pip "Pillow>=9"
      - name: Compile Python
        run: python -m compileall -q haunted_blender
      - name: Check browser JavaScript
        run: node --check haunted_blender/web/cockpit.js
      - name: Full suite
        run: python -m unittest discover -s tests -v
      - name: Parts Harvester command door
        run: python -m haunted_blender.parts_harvester_cli --help
      - name: Puppet Studio command door
        run: python -m haunted_blender.puppet_cli --help
      - name: Doctor command door
        run: python -m haunted_blender.weakest_window_cli --help
